# The feature tables on the site's Features page (site/pages/features.md,
# #455). site/build.py turns this file into the two tables where the page
# says {{features}}. Update it with the CHANGELOG.
#
# Each platform cell starts with one of:
#   "yes"      supported
#   "partly"   supported with a limit, explained after a colon
#   "not yet"  planned or missing; put a link to its issue after the colon
#   "n/a"      does not apply
# Text after the colon is Markdown. Links to other site pages are .md links.

platforms = ["Windows", "Linux and Steam Deck", "macOS", "Android"]

